<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoT SV-Intervention</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="masthead">
    <h1>CoT&nbsp;SV-Intervention</h1>
    <p class="sub">Pause a rollout at a token · nudge singular vectors at that token · regenerate</p>
  </header>

  <main class="shell">
    <!-- LEFT: rollout picker + edit builder -->
    <section class="panel controls">
      <div class="field-row">
        <label>Dataset
          <select id="dataset"></select>
        </label>
        <label>Rollout
          <select id="rollout"></select>
        </label>
      </div>
      <div id="rollout-meta" class="meta-line"></div>
      <div id="mismatch-warn" class="warn" hidden></div>

      <h2>Edits <span class="hint">applied only at the pause token</span></h2>
      <div class="field-row">
        <label>Basis
          <select id="basis">
            <option value="unrealized">unrealized</option>
            <option value="predictive">predictive</option>
          </select>
        </label>
      </div>
      <div id="edits"></div>
      <button id="add-edit" class="ghost">+ Add edit</button>

      <h2>Run</h2>
      <div class="field-row wrap">
        <label>Samples <input id="n_samples" type="number" min="1" max="8" value="3" /></label>
        <label>Temp <input id="temperature" type="number" step="0.05" min="0" value="0.7" /></label>
        <label>top_p <input id="top_p" type="number" step="0.05" min="0" max="1" value="0.95" /></label>
        <label>Seed <input id="seed" type="number" value="0" /></label>
        <label>Max new <input id="max_new_tokens" type="number" min="1" value="256" /></label>
      </div>
      <button id="run" class="primary" disabled>Run intervention</button>
      <div id="status" class="status"></div>
    </section>

    <!-- MIDDLE: token stream -->
    <section class="panel stream-panel">
      <h2>Reasoning tokens <span class="hint">click a token to set the pause point</span></h2>
      <div id="pause-info" class="meta-line"></div>
      <div id="stream" class="stream"></div>
    </section>

    <!-- RIGHT: results -->
    <section class="panel results">
      <h2>Continuations</h2>
      <div id="telemetry" class="telemetry"></div>
      <div class="result-cols">
        <div class="result-col">
          <h3>Original</h3>
          <div id="col-original"></div>
        </div>
        <div class="result-col">
          <h3>Baseline <span class="hint">no edit</span></h3>
          <div id="col-baseline"></div>
        </div>
        <div class="result-col intervened">
          <h3>Intervened</h3>
          <div id="col-intervened"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
